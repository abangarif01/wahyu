<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Undangan Pernikahan — Arif & Laila</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <img class="hero" src="assets/placeholder.svg" alt="Gambar anime pasangan">
    <div class="content">
      <h1>Arif &amp; Laila</h1>
      <p class="lead">Dengan penuh kebahagiaan kami mengundang Anda untuk hadir pada acara pernikahan kami.</p>

      <dl class="details">
        <dt>Hari / Tanggal</dt>
        <dd id="date">[ISI TANGGAL DI SINI]</dd>
        <dt>Waktu</dt>
        <dd id="time">[ISI WAKTU DI SINI]</dd>
        <dt>Tempat</dt>
        <dd id="place">[ISI LOKASI DI SINI]</dd>
      </dl>

      <div class="actions">
        <button id="rsvpBtn">Konfirmasi Hadir</button>
        <button id="printBtn">Simpan sebagai PDF</button>
      </div>
    </div>
    <div class="footer">RSVP: <span id="rsvpInfo">[NAMA / NOMOR / WA]</span></div>
  </main>

  <script src="script.js"></script>
</body>
</html>
